# Minimal setuptools config for ``phase15_v4`` — redundant with ``pyproject.toml``
# (which is the modern canonical metadata source and is consumed by setuptools>=68
# via PEP 517). Kept per Plan §1 P12 + Nikinger-Auftrag 2026-09-07
# ("+ setup.cfg NEU"), explicitly minimal: identity-only metadata mirroring the
# ``[project]`` section in ``pyproject.toml`` so any tooling that reads the
# legacy ``setup.cfg`` path (e.g. older ``pkg_resources`` lookups, CI-linters,
# IDE-indexers) still resolves the package.
#
# Editing note: ``pyproject.toml`` is the source of truth; this file is a
# intentional mirror and must stay bit-equivalent in ``name``/``version``.
# If the two ever drift, fix ``pyproject.toml`` first, then mirror.

[metadata]
name = phase15_v4
version = 0.1.0
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#3fb950"/>
    </marker>
    <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#bc8cff"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#d29922"/>
    </marker>
  </defs>

  <rect width="1080" height="1080" fill="#0d1117"/>
  <rect x="0" y="0" width="1080" height="6" fill="#3fb950"/>

  <!-- ============ HEADER ============ -->
  <text x="36" y="58" fill="#3fb950" font-size="34" font-weight="bold">Phase 7  —  Reward / Brain</text>
  <text x="36" y="88" fill="#8b949e" font-size="16">Der Bot beginnt zu lernen · prozess-bewusster Score + Lessons</text>

  <!-- status badges -->
  <g font-size="13">
    <rect x="704" y="34" width="158" height="26" rx="5" fill="#161b22" stroke="#3fb950"/>
    <text x="717" y="51" fill="#3fb950">● live-verified 06-26</text>
    <rect x="872" y="34" width="172" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="884" y="51" fill="#c9d1d9">128 P7-Tests · live 5/5</text>
    <rect x="704" y="66" width="340" height="24" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="717" y="83" fill="#8b949e">Regression grün: P1 52 · P2 62 · P4 94 · P5 146 · P6 70</text>
  </g>
  <line x1="36" y1="108" x2="1044" y2="108" stroke="#30363d"/>

  <!-- ============ PIPELINE ============ -->
  <text x="36" y="138" fill="#58a6ff" font-size="15" font-weight="bold">PIPELINE  ·  injizierte Naht in den P5-Executor (reward_sink, default None → P5 bit-identisch · spiegelt P6 debate_runner)</text>

  <!-- OPEN seam -->
  <rect x="36" y="156" width="250" height="92" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="50" y="180" fill="#3fb950" font-size="15" font-weight="bold">on_trade_opened()</text>
  <text x="50" y="201" fill="#8b949e" font-size="12">Decision-Kontext-Snapshot:</text>
  <text x="50" y="219" fill="#c9d1d9" font-size="12">gate_path · confidences · spread</text>
  <text x="50" y="236" fill="#c9d1d9" font-size="12">initial_risk · intended_open_level*</text>

  <!-- CLOSE seam -->
  <rect x="36" y="266" width="250" height="84" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="50" y="290" fill="#3fb950" font-size="15" font-weight="bold">on_trade_closed()</text>
  <text x="50" y="311" fill="#8b949e" font-size="12">aus P5 monitor_position:</text>
  <text x="50" y="329" fill="#c9d1d9" font-size="12">CLOSED_BY_BROKER | TIME_STOP</text>

  <!-- recorder -->
  <rect x="330" y="200" width="186" height="118" rx="8" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="344" y="226" fill="#58a6ff" font-size="16" font-weight="bold">recorder.py</text>
  <text x="344" y="248" fill="#8b949e" font-size="12">Orchestrierung,</text>
  <text x="344" y="265" fill="#8b949e" font-size="12">fail-closed (J)</text>
  <text x="344" y="289" fill="#f85149" font-size="11.5">Fehler → log.critical,</text>
  <text x="344" y="305" fill="#f85149" font-size="11.5">nie in den Close-Pfad</text>

  <line x1="286" y1="202" x2="328" y2="240" stroke="#3fb950" marker-end="url(#arrG)"/>
  <line x1="286" y1="306" x2="328" y2="278" stroke="#3fb950" marker-end="url(#arrG)"/>

  <!-- three lanes -->
  <!-- lane 1 pnl -->
  <rect x="560" y="150" width="232" height="78" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="574" y="174" fill="#d29922" font-size="14" font-weight="bold">pnl_resolver.py</text>
  <text x="574" y="194" fill="#c9d1d9" font-size="11.5">P&amp;L ← Close-Confirm (lag-frei)</text>
  <text x="574" y="211" fill="#8b949e" font-size="11.5">Fallback: get_trade_history</text>
  <text x="574" y="223" fill="#8b949e" font-size="10.5">→ R-multiple = P&amp;L / initial_risk</text>

  <!-- lane 2 scorer -->
  <rect x="560" y="240" width="232" height="78" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="574" y="264" fill="#3fb950" font-size="14" font-weight="bold">scorer.py  (B2)</text>
  <text x="574" y="284" fill="#c9d1d9" font-size="11.5">outcome_Δ (gebremst, geclippt)</text>
  <text x="574" y="301" fill="#c9d1d9" font-size="11.5">+ process_Δ (exit/entry/debate)</text>
  <text x="574" y="313" fill="#8b949e" font-size="10.5">→ score_after ∈ [0,100] (clamped)</text>

  <!-- lane 3 brain -->
  <rect x="560" y="330" width="232" height="78" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="574" y="354" fill="#bc8cff" font-size="14" font-weight="bold">brain.reflect()  ◇ AI</text>
  <text x="574" y="374" fill="#c9d1d9" font-size="11.5">1 Haiku-Call, best-effort, 20s</text>
  <text x="574" y="391" fill="#8b949e" font-size="11.5">entkoppelt · reuse LLMClient</text>
  <text x="574" y="403" fill="#8b949e" font-size="10.5">+ token_meter (8-Feld)</text>

  <line x1="516" y1="234" x2="558" y2="196" stroke="#58a6ff" marker-end="url(#arr)"/>
  <line x1="516" y1="259" x2="558" y2="272" stroke="#58a6ff" marker-end="url(#arr)"/>
  <line x1="516" y1="284" x2="558" y2="352" stroke="#58a6ff" marker-end="url(#arr)"/>

  <!-- DB tables -->
  <rect x="836" y="150" width="208" height="258" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="850" y="173" fill="#58a6ff" font-size="14" font-weight="bold">SQLite (P2-CRUD)</text>
  <text x="850" y="190" fill="#8b949e" font-size="10.5">reuse: insert_trade / _reward / _lesson</text>

  <rect x="850" y="200" width="180" height="52" rx="5" fill="#161b22" stroke="#3fb950"/>
  <text x="862" y="220" fill="#3fb950" font-size="12.5" font-weight="bold">trade_outcomes</text>
  <text x="862" y="240" fill="#8b949e" font-size="10.5">OPEN→CLOSE · +account*</text>

  <rect x="850" y="262" width="180" height="52" rx="5" fill="#161b22" stroke="#3fb950"/>
  <text x="862" y="282" fill="#3fb950" font-size="12.5" font-weight="bold">reward_pts</text>
  <text x="862" y="302" fill="#8b949e" font-size="10.5">score_after · +r_multiple*</text>

  <rect x="850" y="324" width="180" height="52" rx="5" fill="#161b22" stroke="#bc8cff"/>
  <text x="862" y="344" fill="#bc8cff" font-size="12.5" font-weight="bold">trade_lessons</text>
  <text x="862" y="364" fill="#8b949e" font-size="10.5">lesson_text (best-effort)</text>

  <text x="850" y="396" fill="#8b949e" font-size="10.5">migration 002: +3 Spalten*</text>

  <line x1="792" y1="189" x2="848" y2="222" stroke="#d29922" marker-end="url(#arrO)"/>
  <line x1="792" y1="279" x2="848" y2="285" stroke="#3fb950" marker-end="url(#arrG)"/>
  <line x1="792" y1="369" x2="848" y2="350" stroke="#bc8cff" marker-end="url(#arrP)"/>

  <!-- loop closure -->
  <path d="M 940 408 L 940 432 L 150 432 L 150 250" fill="none" stroke="#39c5cf" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="392" y="420" width="296" height="24" rx="5" fill="#0d1117" stroke="#39c5cf"/>
  <text x="406" y="437" fill="#39c5cf" font-size="12">Loop-Closure (I): get_recent_lessons → P4-Research-Prompt</text>

  <line x1="36" y1="460" x2="1044" y2="460" stroke="#30363d"/>

  <!-- ============ MATH / DECISIONS ============ -->
  <text x="36" y="488" fill="#58a6ff" font-size="15" font-weight="bold">DETERMINISTISCHE MATHE  ·  „So wenig AI wie möglich" — jede Zahl ist Code, nie LLM-Output</text>

  <!-- confidence -->
  <rect x="36" y="504" width="496" height="150" rx="8" fill="#161b22" stroke="#39c5cf" stroke-width="1.5"/>
  <text x="50" y="528" fill="#39c5cf" font-size="15" font-weight="bold">confidence.py  ·  outcome-anchored (C)</text>
  <text x="50" y="552" fill="#c9d1d9" font-size="13">win  → Wilson-Lower-Bound  (klein-N-stabil ab n≈10)</text>
  <text x="50" y="573" fill="#c9d1d9" font-size="13">edge → expectancy_R = mean(P&amp;L / initial_risk)</text>
  <text x="50" y="594" fill="#c9d1d9" font-size="13">qual → SQN = √N·mean(R)/σ(R)   (nur Nebenmetrik)</text>
  <rect x="50" y="606" width="468" height="38" rx="5" fill="#0d1117" stroke="#d29922"/>
  <text x="62" y="623" fill="#d29922" font-size="12.5">N &lt; n_min(10) → INSUFFICIENT, confidence_value = None</text>
  <text x="62" y="639" fill="#8b949e" font-size="11.5">observe-only — gatet keine Order, moduliert kein risk_pct</text>

  <!-- scorer formula -->
  <rect x="548" y="504" width="496" height="150" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="562" y="528" fill="#3fb950" font-size="15" font-weight="bold">scorer.py  ·  Prozess statt Outcome (B2/D)</text>
  <text x="562" y="552" fill="#c9d1d9" font-size="12.5">outcome_Δ = w·clip(R,±3)·(loss_asym if loss)</text>
  <text x="562" y="573" fill="#c9d1d9" font-size="12.5">process_Δ = w·( exit ± + entry + debate )</text>
  <text x="576" y="591" fill="#8b949e" font-size="11">exit: +SL/TP-Hit · −TIME_STOP   entry: +enger Spread</text>
  <text x="576" y="606" fill="#8b949e" font-size="11">debate: (conf−0.5) schwach, additiv — nie Multiplikator</text>
  <rect x="562" y="616" width="468" height="28" rx="5" fill="#0d1117" stroke="#3fb950"/>
  <text x="574" y="634" fill="#c9d1d9" font-size="11.5">Δ clamp ±5/Trade → score_after clamp [0,100]; Risk-Level binär (50) unverändert</text>

  <line x1="36" y1="674" x2="1044" y2="674" stroke="#30363d"/>

  <!-- ============ AS-BUILT DEVIATIONS ============ -->
  <text x="36" y="702" fill="#d29922" font-size="15" font-weight="bold">⬤ AS-BUILT: 5 Live-Verfeinerungen ggü. Plan  (Code = Quelle der Wahrheit)</text>

  <g font-size="12">
    <rect x="36" y="716" width="330" height="96" rx="7" fill="#161b22" stroke="#d29922"/>
    <text x="48" y="737" fill="#d29922" font-size="13" font-weight="bold">1 · P&amp;L-Pivot (13b/13c)</text>
    <text x="48" y="757" fill="#c9d1d9">IG-Demo bucht get_trade_history erst</text>
    <text x="48" y="773" fill="#c9d1d9">nach Settlement → intraday unbrauchbar.</text>
    <text x="48" y="789" fill="#3fb950">P5-monitor erweitert: P&amp;L + close_level</text>
    <text x="48" y="804" fill="#3fb950">reisen aus der Close-Confirm mit.</text>

    <rect x="375" y="716" width="330" height="96" rx="7" fill="#161b22" stroke="#d29922"/>
    <text x="387" y="737" fill="#d29922" font-size="13" font-weight="bold">2 · migration 002 = +3 Spalten</text>
    <text x="387" y="757" fill="#c9d1d9">initial_risk · r_multiple · account</text>
    <text x="387" y="773" fill="#8b949e">(account neu — Operator 06-18, für</text>
    <text x="387" y="789" fill="#8b949e">include_demo_in_edge-Filter)</text>
    <text x="387" y="805" fill="#3fb950">+ Whitelist-Erweiterung in db.py</text>

    <rect x="714" y="716" width="330" height="96" rx="7" fill="#161b22" stroke="#d29922"/>
    <text x="726" y="737" fill="#d29922" font-size="13" font-weight="bold">3 · open_level rekonstruiert</text>
    <text x="726" y="757" fill="#c9d1d9">place_order propagiert den Fill nicht →</text>
    <text x="726" y="773" fill="#c9d1d9">intended entry aus price_env</text>
    <text x="726" y="789" fill="#8b949e">(BUY→ask / SELL→bid). live_db_path</text>
    <text x="726" y="805" fill="#8b949e">reconciled → data/trading_bot.sqlite</text>
  </g>

  <line x1="36" y1="832" x2="1044" y2="832" stroke="#30363d"/>

  <!-- ============ BOUNDARIES + LIVE ============ -->
  <text x="36" y="860" fill="#f85149" font-size="15" font-weight="bold">GRENZEN</text>
  <rect x="36" y="872" width="496" height="100" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="50" y="895" fill="#f85149" font-size="13.5" font-weight="bold">◆ Keine VETO-Berührung</text>
  <text x="50" y="916" fill="#c9d1d9" font-size="12.5">AI = nur brain.reflect() (Sprache→Erkenntnis).</text>
  <text x="50" y="935" fill="#c9d1d9" font-size="12.5">Score/Confidence triggern nie eine Order.</text>
  <text x="50" y="956" fill="#bc8cff" font-size="12.5">Instinct→VETO-Promotion („volle ECC") → Phase 9.</text>

  <text x="560" y="860" fill="#3fb950" font-size="15" font-weight="bold">LIVE-LAUF (IG Demo, 5/5)</text>
  <rect x="560" y="872" width="484" height="100" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="574" y="895" fill="#c9d1d9" font-size="12.5">SELL platziert → TIME_STOP-Close →</text>
  <text x="574" y="915" fill="#c9d1d9" font-size="12.5">trade_outcomes CLOSED + reward_pts + trade_lessons</text>
  <text x="574" y="935" fill="#c9d1d9" font-size="12.5">geschrieben; P&amp;L lag-frei aus Close-Confirm.</text>
  <text x="574" y="958" fill="#d29922" font-size="12.5">⚠ live-verified ≠ profit-validated (erst 1 Trade)</text>

  <!-- footer -->
  <line x1="36" y1="992" x2="1044" y2="992" stroke="#30363d"/>
  <text x="36" y="1018" fill="#8b949e" font-size="12">Paket  phase7_reward/reward/  ·  reuse: research.LLMClient · research.token_meter · P2-Database-CRUD  ·  Demo-only, manueller Trigger (Scheduler = P8)</text>
  <text x="36" y="1040" fill="#8b949e" font-size="12">Decisions  A Naht · B2 Prozess-Score · C observe-only Confidence · D Stabilität · E entkoppelte Lesson · F Reuse · G Ownership · H Synthetik/Echt-Trennung · J fail-closed</text>
  <text x="36" y="1062" fill="#484f58" font-size="11">trading-bot-lizard-branch · phase7_reward_konzept.svg · GitHub-Dark · 1080×1080</text>
  <circle cx="1028" cy="1054" r="5" fill="#3fb950"/>
</svg>

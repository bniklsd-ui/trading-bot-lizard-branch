  <text x="60" y="988" fill="#c9d1d9" font-size="13">Gap 0,00 pp ≤ Δ 10 pp        → TRUE</text>
  <text x="60" y="1010" fill="#c9d1d9" font-size="13">E 73,50 € ≥ M 120 €          → FALSE</text>
  <line x1="60" y1="1024" x2="510" y2="1024" stroke="#30363d"/>
  <text x="60" y="1050" fill="#e6edf3" font-size="15" font-weight="bold">Migrate = FALSE → KEINE MIGRATION</text>
  <text x="60" y="1078" fill="#3fb950" font-size="12.5">Feuerlöscher-Befund: im Zwangsfall ist OpenCode</text>
  <text x="60" y="1097" fill="#3fb950" font-size="12.5">+ gleiches Modell ein belegter Build-Pfad (0 pp),</text>
  <text x="60" y="1116" fill="#3fb950" font-size="12.5">Doc-Layers-Navigation portiert nachweislich.</text>

  <rect x="550" y="928" width="490" height="200" rx="10" fill="#161b22" stroke="#3fb950"/>
  <text x="570" y="958" fill="#3fb950" font-size="17" font-weight="bold">DELIVERABLES (unabhängig vom Ausgang)</text>
  <text x="570" y="988" fill="#e6edf3" font-size="13">✓ AGENTS.md — Repo-Root, @ref on need-to-know</text>
  <text x="570" y="1012" fill="#e6edf3" font-size="13">✓ OpenAICompatLLMClient (OpenRouter) — kalt,</text>
  <text x="588" y="1031" fill="#8b949e" font-size="12">  rein additiv, null Live-Pfad-Diff, mocked Tests</text>
  <text x="570" y="1055" fill="#e6edf3" font-size="13">✓ Operator-Smoke: PASS (valid abstain) durch den</text>
  <text x="588" y="1074" fill="#8b949e" font-size="12">  echten P4-Validator; 400-Fail sauber klassifiziert</text>
  <text x="570" y="1098" fill="#e6edf3" font-size="13">✓ Specs S1–S7 = fertiger Bauplan für echten</text>
  <text x="588" y="1117" fill="#8b949e" font-size="12">  Abstain-Lessons-Build (V3)</text>

  <!-- ================= ROW 5: LEARNINGS ================= -->
  <rect x="40" y="1148" width="1000" height="132" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="1176" fill="#bc8cff" font-size="15" font-weight="bold">VORFÄLLE &amp; LEARNINGS (alle offengelegt, nichts still gepatcht)</text>
  <text x="60" y="1202" fill="#c9d1d9" font-size="12.5">▸ OpenCode-Trial entkam trotz korrektem cwd in das Live-Repo → --dir + OS-Write-Lock nachgerüstet, hielt über alle 20 Trials</text>
  <text x="60" y="1224" fill="#c9d1d9" font-size="12.5">▸ Manual-Spend-Prompt crashte non-interaktiv (EOFError) → beide Harnesse parsen jetzt ihre eigene autoritative Cost-JSON</text>
  <text x="60" y="1246" fill="#c9d1d9" font-size="12.5">▸ Effort-Korrektur: Sonnet 5 defaulted auf high (nicht medium) → M1-D4 datiert korrigiert · Key-Guthaben lag zeitweise unter Cap</text>
  <text x="60" y="1268" fill="#c9d1d9" font-size="12.5">▸ Spend-Rekonziliation: $9,30 berechnet vs. $9,27 Console (0,3 %) — Messinstrument bestätigt</text>

  <!-- footer -->
  <text x="40" y="1322" fill="#8b949e" font-size="12">meta_m1_harness/ · META_M1_{PREREGISTRATION,RESULTS,DECISION,CLOSEOUT_HANDOVER}.md · AGENTS.md · phase4_research/research/llm_openai_compat.py</text>

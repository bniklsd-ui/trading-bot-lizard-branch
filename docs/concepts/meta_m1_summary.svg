  <text x="60" y="756" fill="#8b949e" font-size="12.5">Step                       claude_code   opencode</text>
  <line x1="60" y1="766" x2="530" y2="766" stroke="#30363d"/>
  <text x="60" y="787" fill="#c9d1d9" font-size="12.5">S1 Modelle+Taxonomie</text><text x="330" y="787" fill="#f85149" font-size="12.5">✗</text><text x="352" y="787" fill="#3fb950" font-size="12.5">✓</text><text x="440" y="787" fill="#3fb950" font-size="12.5">✓</text><text x="462" y="787" fill="#f85149" font-size="12.5">✗</text>
  <text x="60" y="808" fill="#c9d1d9" font-size="12.5">S2 Klassifizierer</text><text x="330" y="808" fill="#3fb950" font-size="12.5">✓</text><text x="352" y="808" fill="#3fb950" font-size="12.5">✓</text><text x="440" y="808" fill="#3fb950" font-size="12.5">✓</text><text x="462" y="808" fill="#3fb950" font-size="12.5">✓</text>
  <text x="60" y="829" fill="#c9d1d9" font-size="12.5">S3 Persistenz</text><text x="330" y="829" fill="#3fb950" font-size="12.5">✓</text><text x="352" y="829" fill="#3fb950" font-size="12.5">✓</text><text x="440" y="829" fill="#3fb950" font-size="12.5">✓</text><text x="462" y="829" fill="#3fb950" font-size="12.5">✓</text>
  <text x="60" y="850" fill="#c9d1d9" font-size="12.5">S4 reflect (AI-Naht)</text><text x="330" y="850" fill="#3fb950" font-size="12.5">✓</text><text x="352" y="850" fill="#3fb950" font-size="12.5">✓</text><text x="440" y="850" fill="#3fb950" font-size="12.5">✓</text><text x="462" y="850" fill="#3fb950" font-size="12.5">✓</text>
  <text x="60" y="871" fill="#c9d1d9" font-size="12.5">S5 Sink+Wiring (Cross-File)</text><text x="330" y="871" fill="#3fb950" font-size="12.5">✓</text><text x="352" y="871" fill="#3fb950" font-size="12.5">✓</text><text x="440" y="871" fill="#3fb950" font-size="12.5">✓</text><text x="462" y="871" fill="#3fb950" font-size="12.5">✓</text>

  <rect x="560" y="748" width="460" height="132" rx="8" fill="#21262d"/>
  <text x="578" y="774" fill="#d29922" font-size="13" font-weight="bold">Die 2 Fails: identische Root-Cause, kein Harness-Gap</text>
  <text x="578" y="798" fill="#c9d1d9" font-size="12">Bare `pytest` im Gate setzt sys.path nicht — ob der</text>
  <text x="578" y="817" fill="#c9d1d9" font-size="12">Import auflöst, hängt an __init__.py-Markern, die die</text>
  <text x="578" y="836" fill="#c9d1d9" font-size="12">Spec dem Agenten überlässt. Bewusst als legitimes</text>
  <text x="578" y="855" fill="#c9d1d9" font-size="12">Signal gewertet, nicht als Instrument-Bug gepatcht.</text>
  <text x="578" y="874" fill="#8b949e" font-size="11.5">Ab S2: beide Harnesse durchgehend gate-clean.</text>

  <!-- ================= ROW 4: DECISION + DELIVERABLES ================= -->
  <rect x="40" y="928" width="490" height="200" rx="10" fill="#161b22" stroke="#f85149"/>

<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans Mono, monospace">
  <!-- background -->
  <rect width="1080" height="1350" fill="#0d1117"/>

  <!-- ================= HEADER ================= -->
  <text x="40" y="52" fill="#58a6ff" font-size="30" font-weight="bold">META-PHASE M1 — Harness-Unabhängigkeit (Build-Front)</text>
  <text x="40" y="82" fill="#8b949e" font-size="15">Vorregistriertes Bake-off: Claude Code vs. OpenCode · trading-bot-lizard-branch · 08.–09.07.2026</text>
  <rect x="878" y="30" width="162" height="34" rx="17" fill="#238636"/>
  <text x="959" y="53" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">✓ ABGESCHLOSSEN</text>
  <line x1="40" y1="100" x2="1040" y2="100" stroke="#30363d" stroke-width="2"/>

  <!-- ================= ROW 1: MISSION + PREREG ================= -->
  <rect x="40" y="118" width="490" height="252" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="148" fill="#bc8cff" font-size="17" font-weight="bold">MISSION &amp; FRAGE</text>
  <text x="60" y="178" fill="#c9d1d9" font-size="13.5">Kein Bot-Feature — eine Methoden-Messung:</text>
  <text x="60" y="202" fill="#e6edf3" font-size="13.5">H_Build: Erreicht ein offener Harness</text>
  <text x="60" y="221" fill="#e6edf3" font-size="13.5">(OpenCode) + festes Modell die Zuverlässig-</text>
  <text x="60" y="240" fill="#e6edf3" font-size="13.5">keit von Claude Code innerhalb Toleranz Δ?</text>
  <text x="60" y="270" fill="#8b949e" font-size="13">Plus 2 Feuerlöscher, unabhängig vom Ausgang:</text>
  <text x="60" y="292" fill="#3fb950" font-size="13">▸ AGENTS.md (Harness-neutraler Einstieg)</text>
  <text x="60" y="312" fill="#3fb950" font-size="13">▸ Kalter P4/P6-Fallback (OpenRouter)</text>
  <text x="60" y="344" fill="#d29922" font-size="12.5">Live-Bot &amp; Live-Pfade: zu keinem Zeitpunkt berührt</text>

  <rect x="550" y="118" width="490" height="252" rx="10" fill="#161b22" stroke="#d29922"/>
  <text x="570" y="148" fill="#d29922" font-size="17" font-weight="bold">VORREGISTRIERUNG (vor der ersten Zahl)</text>
  <text x="570" y="177" fill="#c9d1d9" font-size="13.5">Δ = 10 pp   P = 35 %   K = 210 €</text>
  <text x="570" y="199" fill="#c9d1d9" font-size="13.5">E = P×K = 73,50 €    M = 120 €</text>
  <rect x="570" y="214" width="450" height="52" rx="6" fill="#21262d"/>
  <text x="588" y="236" fill="#e6edf3" font-size="13.5" font-weight="bold">Migrieren ⇔ Gap ≤ Δ  UND  E ≥ M</text>
  <text x="588" y="256" fill="#f85149" font-size="13">E &lt; M ⇒ Migration vorab ausgeschlossen</text>
  <text x="570" y="292" fill="#8b949e" font-size="12.5">Zweck damit reframed: Feuerlöscher-Test des</text>
  <text x="570" y="311" fill="#8b949e" font-size="12.5">Build-Pfads — belastbare Zahl für den Zwangsfall.</text>
  <text x="570" y="341" fill="#d29922" font-size="12.5">Anti-Shopping: Δ/P/K/M nach Messung unantastbar</text>

  <!-- ================= ROW 2: EXPERIMENT DESIGN ================= -->
  <rect x="40" y="390" width="1000" height="186" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="420" fill="#58a6ff" font-size="17" font-weight="bold">EXPERIMENT — 20 Messtrials, vollständig isoliert</text>

  <!-- pipeline boxes -->
  <rect x="60" y="440" width="180" height="58" rx="8" fill="#21262d" stroke="#8b949e"/>
  <text x="150" y="464" fill="#e6edf3" font-size="13" text-anchor="middle">Wegwerf-Fork</text>
  <text x="150" y="484" fill="#8b949e" font-size="11.5" text-anchor="middle">Keyring neutralisiert</text>
  <text x="253" y="475" fill="#8b949e" font-size="16">→</text>
  <rect x="275" y="440" width="200" height="58" rx="8" fill="#21262d" stroke="#8b949e"/>
  <text x="375" y="464" fill="#e6edf3" font-size="13" text-anchor="middle">Referenz-Build S1–S7</text>
  <text x="375" y="484" fill="#8b949e" font-size="11.5" text-anchor="middle">git tags base-0…base-7</text>
  <text x="488" y="475" fill="#8b949e" font-size="16">→</text>
  <rect x="510" y="440" width="250" height="58" rx="8" fill="#21262d" stroke="#8b949e"/>
  <text x="635" y="464" fill="#e6edf3" font-size="13" text-anchor="middle">S1–S5 × 2 Repeats × 2 Harnesse</text>
  <text x="635" y="484" fill="#8b949e" font-size="11.5" text-anchor="middle">je Trial: reset auf base-(k−1)</text>
  <text x="773" y="475" fill="#8b949e" font-size="16">→</text>
  <rect x="795" y="440" width="225" height="58" rx="8" fill="#21262d" stroke="#8b949e"/>
  <text x="907" y="464" fill="#e6edf3" font-size="13" text-anchor="middle">trials.jsonl → analyze.py</text>
  <text x="907" y="484" fill="#8b949e" font-size="11.5" text-anchor="middle">gate_pass · wall · cost</text>

  <text x="60" y="528" fill="#c9d1d9" font-size="12.5">Testfeld: Abstain-/No-Trade-Lessons-Modul (V3-Item, vorgezogen — Specs dienen doppelt als späterer echter Bauplan)</text>
  <text x="60" y="550" fill="#8b949e" font-size="12.5">Sonnet 5 @ high in beiden (korrigiert 08.07.) · separater API-Key, keyring-only · Trials außerhalb Handelsfenster · Cap 50 €</text>

  <!-- ================= ROW 3: RESULTS ================= -->
  <rect x="40" y="596" width="1000" height="312" rx="10" fill="#161b22" stroke="#3fb950"/>
  <text x="60" y="626" fill="#3fb950" font-size="17" font-weight="bold">ERGEBNIS — 20/20 Trials, kein Budget-Stopp, kein Isolations-Vorfall</text>

  <!-- headline metric table -->
  <text x="60" y="660" fill="#8b949e" font-size="12.5">Harness            gate_pass    wall_s (μ±σ)      Spend (USD)   edit_failures</text>
  <line x1="60" y1="670" x2="640" y2="670" stroke="#30363d"/>
  <text x="60" y="692" fill="#e6edf3" font-size="13">claude_code        90 % (9/10)  118,3 ± 94,3      $6,90         0</text>
  <text x="60" y="716" fill="#e6edf3" font-size="13">opencode           90 % (9/10)  154,5 ± 101,7     $4,37         0</text>


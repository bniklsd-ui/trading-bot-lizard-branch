<text x="484" y="233" class="tm">{ trading_window: { start_cet, end_cet },  risk: { max_risk_pct, position_cap_gbp },</text>
<text x="484" y="245" class="tm">  filters: { max_spread_pct: 0.5, min_confidence: 55 },  research: { candidates_ttl_min: 30 } }</text>
<!-- ╚══╝ y=258 -->


<text x="22" y="655" class="tm" style="fill:#B45309;">Phase 1 → 2</text>
<text x="94" y="655" class="tm">Envelope.data (dict) → insert_trade()  ·  close_data dict → update_trade_close()  ·  broker field already "ig"</text>
<text x="22" y="667" class="tm" style="fill:#3B6DB7;">Phase 5 →</text>
<text x="84" y="667" class="tm">record_trade_complete(trade, reward?, lesson?, regime?, context?)  ← all-or-nothing BEGIN IMMEDIATE transaction</text>
<text x="22" y="679" class="tm" style="fill:#0D9488;">Reconcile</text>
<text x="82" y="679" class="tm">refs = db.get_unreconciled_deal_references()  →  broker.reconcile_positions(expected_references=refs)</text>
<text x="22" y="691" class="tm" style="fill:#8B5CF6;">Phase 7 →</text>
<text x="84" y="691" class="tm">insert_reward(trade_id, reward)  ·  insert_lesson(trade_id, lesson)  ·  mark_lesson_used(lesson_id)</text>


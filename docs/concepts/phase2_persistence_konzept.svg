<rect x="472" y="264" width="3"   height="90" rx="1" fill="#FBBF24"/>
<rect x="472" y="264" width="480" height="22" rx="4" fill="#1A1000"/>
<text x="484" y="279" class="ts" style="fill:#B45309;">turbo_candidates.json</text>
<text x="600" y="279" class="tm" style="fill:#374151;">research output  ·  written by Phase 4  ·  consumed by Phase 5 Gate 2</text>
<text x="484" y="295" class="tm">{ generated_at,  ttl_minutes: 30,  expires_at (ISO 8601 UTC),  session_date,</text>
<text x="484" y="307" class="tm">  candidates: [ { epic, direction, confidence, reasoning, spread_pct_at_research } ] }</text>
<text x="484" y="319" class="tm" style="fill:#B45309;">TTL: 30 min via explicit expires_at field</text>
<text x="484" y="331" class="tm">load_candidates() → [] on expiry  ·  candidates_are_fresh()  ·  clear_candidates()</text>
<text x="484" y="343" class="tm" style="fill:#374151;">save_candidates(candidates, ttl_minutes=30, session_date=...) — always writes fresh expires_at</text>
<!-- ╚══╝ y=354 -->


<text x="164" y="130" class="tm" style="fill:#374151;">·</text>
<text x="172" y="130" class="tm">temp_store = MEMORY</text>
<text x="296" y="130" class="tm" style="fill:#374151;">·</text>
<text x="304" y="130" class="tm">cache_size = -64000 (64 MB)</text>


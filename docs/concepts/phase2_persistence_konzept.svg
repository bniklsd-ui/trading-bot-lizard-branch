<text x="484" y="415" class="tm" style="fill:#374151;">berlin_now_decimal_hours()  ·  parse_utc_iso()  ·  zoneinfo stdlib (tzdata on Windows)</text>
<!-- ╚══╝ y=424 -->

<!-- ╔══ defaults.py  y=430..498 ══╗ -->
<rect x="472" y="430" width="480" height="68" rx="4" fill="#070E1A" stroke="#1E3A5F" stroke-width="0.8"/>
<rect x="472" y="430" width="3"   height="68" rx="1" fill="#60A5FA"/>
<rect x="472" y="430" width="480" height="22" rx="4" fill="#0A1628"/>
<text x="484" y="445" class="ts" style="fill:#2563EB;">persistence/defaults.py — ig_config_state seed values</text>
<text x="484" y="461" class="tm" style="fill:#93C5FD;">bot_score</text>
<text x="548" y="461" class="tm">→ 50.0  (neutral start · earn AGGRESSIV by pushing score above 50)</text>
<text x="484" y="473" class="tm" style="fill:#93C5FD;">risk_level</text>
<text x="548" y="473" class="tm">→ "KONSERVATIV"  ·  score ≤ 50 = KONSERVATIV  ·  score > 50 = AGGRESSIV</text>
<text x="484" y="485" class="tm" style="fill:#93C5FD;">daily_pnl_today</text>
<text x="584" y="485" class="tm">→ 0.0  ·  consec_losses → 0  ·  last_trade_id → null</text>
<!-- ╚══╝ y=498 -->

<!-- ╔══ design decisions  y=504..616 ══╗ -->
<rect x="472" y="504" width="480" height="112" rx="4" fill="#040A14" stroke="#0F2040" stroke-width="0.6"/>
<rect x="472" y="504" width="3"   height="112" rx="1" fill="#1E3A5F"/>
<rect x="472" y="504" width="480" height="22" rx="4" fill="#0A1628"/>
<text x="484" y="519" class="ts" style="fill:#374151;">design decisions locked in Phase 2</text>
<text x="484" y="535" class="tm" style="fill:#475569;">isolation</text>
<text x="540" y="535" class="tm">→  persistence/ never imports broker_wrapper · data flows as plain dicts</text>
<text x="484" y="547" class="tm" style="fill:#475569;">connection</text>
<text x="548" y="547" class="tm">→  one persistent sqlite3 conn per Database instance · context manager</text>
<text x="484" y="559" class="tm" style="fill:#475569;">WAL</text>
<text x="510" y="559" class="tm">→  Phase 5 (write) + Phase 8 (read) coexist without blocking</text>
<text x="484" y="571" class="tm" style="fill:#475569;">time lib</text>
<text x="536" y="571" class="tm">→  time-machine (not freezegun) — 100× faster · C-level mock</text>
<text x="484" y="583" class="tm" style="fill:#475569;">data dir</text>
<text x="534" y="583" class="tm">→  ~/trading-bot/data/ · gitignored · outside all phase dirs</text>
<text x="484" y="595" class="tm" style="fill:#8B1414;">force_trigger</text>
<text x="568" y="595" class="tm" style="fill:#475569;">→  NOT in defaults — anti-pattern per CLAUDE.md · no bypass lever</text>
<!-- ╚══╝ y=616 -->


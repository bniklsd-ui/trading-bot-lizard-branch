<text x="484" y="139" class="ts" style="fill:#0D9488;">ig_state.json</text>
<text x="556" y="139" class="tm" style="fill:#374151;">account snapshot  ·  updated on every get_account() call</text>
<text x="484" y="155" class="tm">{ balance, available, profit_loss, currency, session_active,</text>
<text x="484" y="167" class="tm">  open_positions: [ { deal_id, epic, direction, size, open_level, P&amp;L } ],  last_updated }</text>
<text x="484" y="179" class="tm" style="fill:#0D9488;">TTL: fresh if last_updated &lt; 60s</text>
<text x="644" y="179" class="tm">·  stale → bot re-fetches before any gate check</text>
<!-- ╚══╝ y=196 -->

<!-- ╔══ ig_config.json  y=202..258 ══╗ -->
<rect x="472" y="202" width="480" height="56" rx="4" fill="#0A1628" stroke="#1E3A5F" stroke-width="0.8"/>

  <text x="48" y="358" fill="#3fb950" font-size="12" font-weight="700">context_builder.py  (CODE)</text>
  <text x="48" y="376" fill="#8b949e" font-size="10.5">= DIE AI-GRENZE. Liest GENAU 1×</text>
  <text x="48" y="391" fill="#8b949e" font-size="10.5">frischen Broker-Snapshot:</text>
  <text x="48" y="408" fill="#c9d1d9" font-size="10.5">get_price · get_ohlcv · get_market_info</text>
  <text x="48" y="425" fill="#8b949e" font-size="10.5">→ frozen DebateContext (Seed +</text>
  <text x="48" y="440" fill="#8b949e" font-size="10.5">  IG-Echtzeit-Spread + recent_bars).</text>


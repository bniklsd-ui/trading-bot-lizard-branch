  <text x="48" y="525" fill="#8b949e" font-size="10.5">Schema vorwärtskompatibel → P9-Tabellen.</text>

  <!-- ============ THE GOTCHA (caching reality) ============ -->
  <rect x="32" y="560" width="896" height="118" rx="8" fill="#1c1606" stroke="#d29922" stroke-width="1.5"/>
  <circle cx="52" cy="582" r="5" fill="#d29922"/>
  <text x="64" y="586" fill="#d29922" font-size="13" font-weight="700">GOTCHA — Caching-Realität (Live-Lauf 2026-06-16, Code = Source of Truth)</text>
  <text x="48" y="608" fill="#c9d1d9" font-size="11">Haiku-4.5 Mindest-Cache-Präfix = <tspan fill="#d29922" font-weight="700">4096 Tokens</tspan>; Sonnet-4.6 = 2048. Bull/Bear (Haiku, ~850–1040 Input-Tokens) liegen WEIT darunter →</text>
  <text x="48" y="626" fill="#c9d1d9" font-size="11">die billigen Agenten cachen <tspan fill="#f85149" font-weight="700">nie</tspan> (cache_creation=0). Nur der Judge (Sonnet) schreibt Cache. Ein Cache-<tspan font-weight="700">READ</tspan> braucht denselben Präfix ≥2× →</text>
  <text x="48" y="644" fill="#c9d1d9" font-size="11">entsteht erst bei <tspan fill="#d29922" font-weight="700">rounds_used ≥ 2</tspan>. Ein 1-Runden-Early-Stop liest nichts → cache_read=0 ist KORREKT (war das einzige rote Live-Assertion, jetzt gefixt).</text>
  <text x="48" y="666" fill="#8b949e" font-size="11">Konsequenz für P7: „Caching“ ist NICHT der große Hebel, den der Plan annahm. Mehr Hebel: kurze stabile Judge-Prompts + Batch-API (50%) für Lesson-Extraktion.</text>


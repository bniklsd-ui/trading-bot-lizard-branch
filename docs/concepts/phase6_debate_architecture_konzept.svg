  <text x="376" y="421" fill="#8b949e" font-size="9.5">pro LONG</text>

  <!-- Bear -->
  <rect x="486" y="370" width="110" height="56" rx="6" fill="#211616" stroke="#f85149"/>
  <circle cx="502" cy="388" r="5" fill="#f85149"/>
  <text x="514" y="392" fill="#f85149" font-size="11.5" font-weight="700">BEAR</text>

  <text x="364" y="452" fill="#8b949e" font-size="10">Judge conclude=true → Early-Stop.  Budget-Caps nach JEDEM Turn:</text>
  <text x="364" y="468" fill="#c9d1d9" font-size="10">calls ≤18 · in ≤120k · out ≤12k · wall-clock ≤120s  → Breach = ABSTAIN</text>
  <text x="364" y="488" fill="#8b949e" font-size="10">confidence ist <tspan fill="#d29922">ADVISORY</tspan> und gatet NICHTS (Decision H, ECE~0.1).</text>
  <text x="364" y="504" fill="#8b949e" font-size="10">Nur Judge-decision ∈ {TRADE, ABSTAIN} entscheidet.</text>
  <text x="364" y="524" fill="#8b949e" font-size="10">Transkript-Kompression (Code, kein Extra-Call) bei 65% Token-Budget.</text>

  <!-- audit -->

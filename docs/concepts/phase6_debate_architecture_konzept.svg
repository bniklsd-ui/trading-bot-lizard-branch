  <text x="230" y="214" fill="#8b949e" font-size="10.5">Judge ist die ECHTE Richtungsquelle — darf den Seed FLIPpen (Decision B).</text>
  <text x="230" y="231" fill="#8b949e" font-size="10.5">Bekommt NIE Broker/VETO/Gate → kann strukturell keinen VETO umgehen (Decision J).</text>
  <text x="230" y="248" fill="#f85149" font-size="10.5">Jeder Fehler / Cap-Breach / Context-Fehler → ABSTAIN (fail-closed).</text>


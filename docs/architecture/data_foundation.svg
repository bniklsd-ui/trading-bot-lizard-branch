  <text x="76" y="900" font-size="11.5" fill="#5b6470">welche Quelle lieferte die Bar —</text>
  <text x="76" y="915" font-size="11.5" fill="#5b6470">sonst ist eine Mischwoche wertlos</text>

  <rect x="308" y="862" width="232" height="58" rx="4" fill="#fff" stroke="#a9cdb8"/>

  <text x="568" y="900" font-size="11.5" fill="#5b6470">eine Woche ohne Messung fällt</text>
  <text x="568" y="915" font-size="11.5" fill="#5b6470">am selben Tag auf, nicht Freitags</text>

  <rect x="800" y="862" width="218" height="58" rx="4" fill="#fff" stroke="#c9a7a1"/>
  <text x="814" y="882" font-size="12.5" font-weight="bold" fill="#c0392b">NICHT gesetzt</text>
  <text x="814" y="900" font-size="11.5" fill="#5b6470">Lightstreamer / Tick-Recorder /</text>
  <text x="814" y="915" font-size="11.5" fill="#5b6470">weitere Provider = Kandidaten</text>

  <text x="62" y="947" font-size="12.5" fill="#1b1f24"><tspan font-weight="bold">Gate vor jeder Technologiewahl:</tspan> Live-Check von get_market_info (zugeordnetes + nicht zugeordnetes Epic) — Nikinger-Aufgabe,</text>
  <text x="62" y="966" font-size="12.5" fill="#1b1f24">sinnvoll gebündelt mit B3s ausstehendem /markets/{epic}-Margin-Check. Dieselbe Response, eine Session.</text>


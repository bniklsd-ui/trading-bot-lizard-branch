  <text x="40" y="1047" font-size="11.5" fill="#5b6470">Offen (Nikinger): Nummerierung (Vorschlag Phase 12 = Datenfundament, V4 → 13) · Reichweite von B · Universe-Reset · Restart-Gate</text>

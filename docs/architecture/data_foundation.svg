  <text x="62" y="285" font-size="13.5" font-weight="bold" fill="#c0392b">Fehlerklasse (dritte Instanz):</text>
  <text x="62" y="306" font-size="13" fill="#1b1f24">Ein statisches, handgepflegtes Artefakt muss mit einer autonom wachsenden Menge synchron bleiben —</text>
  <text x="62" y="325" font-size="13" fill="#1b1f24">und nichts erkennt die Divergenz.</text>
  <text x="62" y="350" font-size="12" fill="#5b6470">1. B1 (07-31): EXTENDED_UNIVERSE point_values vs. DB-Universum → 40×-Oversizing, 3 Broker-Rejects</text>
  <text x="62" y="367" font-size="12" fill="#5b6470">2. heute: Ticker-Zuordnung vs. entdecktes Universum   ·   3. latent: „Bars sind gratis“ vs. IG-Kontingent</text>

  <!-- ============ WARUM ============ -->
  <text x="40" y="418" font-size="18" font-weight="bold" fill="#b26a00">WARUM ES DREIMAL DIE MESSUNG TRAF</text>

  <rect x="40" y="432" width="1000" height="150" rx="6" fill="#fdf7ec" stroke="#e8d5b0"/>
  <text x="62" y="456" font-size="13" fill="#1b1f24">Phase 11 sollte <tspan font-weight="bold">eine</tspan> Frage beantworten — WI-2/W2: erreicht ein 30-Pkt-Stop / 45-Pkt-Ziel je seinen 240-Min-Time-Stop?</text>


  <text x="76" y="507" font-size="11.5" fill="#5b6470">„MINUTE_1“ keine gültige IG-Resolution</text>

  <rect x="390" y="470" width="300" height="46" rx="4" fill="#fff" stroke="#dcc79a"/>
  <text x="404" y="489" font-size="12" font-weight="bold" fill="#1b1f24">Woche 2 · 07-27/31</text>
  <text x="404" y="507" font-size="11.5" fill="#5b6470">Funnel liefert 0 Kandidaten</text>

  <rect x="718" y="470" width="300" height="46" rx="4" fill="#fff" stroke="#dcc79a"/>
  <text x="732" y="489" font-size="12" font-weight="bold" fill="#1b1f24">Woche 3 · 08-03/07</text>
  <text x="732" y="507" font-size="11.5" fill="#5b6470">IG-Kontingent erschöpft, 18/22 quarantined</text>

  <text x="62" y="543" font-size="13" fill="#1b1f24">Drei Symptome, eine Ebene: die <tspan font-weight="bold">Beschaffung</tspan>, nie die Auswertung. Die Messlogik war jedes Mal in Ordnung.</text>
  <text x="62" y="566" font-size="13" fill="#c0392b" font-weight="bold">Und: drei Wochen Totalausfall ohne einen einzigen Alarm — das ist selbst ein Befund.</text>

  <!-- ============ DER BEFUND ============ -->
  <rect x="40" y="600" width="1000" height="92" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.6"/>
  <text x="62" y="626" font-size="15" font-weight="bold" fill="#c0392b">Der Befund, der alles einordnet</text>
  <text x="62" y="650" font-size="13" fill="#1b1f24">Die Mehrquellen-Kette, die genau dieses Problem löst, existiert seit Phase 9 Step 6 fertig gebaut und getestet —</text>
  <text x="62" y="671" font-size="13" fill="#1b1f24"><tspan font-weight="bold">und lief noch nie.</tspan> enable_ig_bars = False, von keinem Startskript gesetzt, in keinem Log. V2a lief voll, V2b blieb dunkel.</text>

  <!-- ============ ZIEL ============ -->
  <text x="40" y="736" font-size="18" font-weight="bold" fill="#1e7a4d">ZIEL — Anforderungen, keine Technologie</text>
  <text x="40" y="757" font-size="13" fill="#5b6470">Prüfbare Eigenschaften. Die Lösung entwirft die nächste Session gegen den Code. „by all means“ — ein Rewrite ist erlaubt.</text>

  <rect x="40" y="772" width="1000" height="216" rx="6" fill="#eef7f1" stroke="#b9dcc7"/>


  <rect x="56" y="652" width="968" height="56" rx="5" fill="#e8f5ee" stroke="#1e7a4d"/>
  <text x="72" y="675" font-size="12.5" font-weight="bold" fill="#1e7a4d">L1 (gelockt): ein Konsument, der Daten braucht, die er nicht hat, bekommt einen typisierten Status — nie einen Kauf.</text>
  <text x="72" y="696" font-size="11" fill="#5b6470">Strukturelle Kostenzusicherung: <tspan font-weight="bold">test_get_window_never_fetches</tspan> (L12) — IG-Provider wirft AssertionError, get_window gibt [] zurück. Grüner Test garantiert, dass der Tracker-Pfad nie kaufen kann.</text>


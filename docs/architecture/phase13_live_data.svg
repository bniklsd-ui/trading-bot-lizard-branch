  <text x="556" y="836" font-size="11" fill="#5b6470">·  <tspan font-weight="bold">EPIC_MAP</tspan> hardcoded in backfill.py:67-72</text>
  <text x="556" y="852" font-size="10.5" fill="#5b6470">    → Phase 14: instrument_source_availability-Tabelle, Map verschwindet</text>

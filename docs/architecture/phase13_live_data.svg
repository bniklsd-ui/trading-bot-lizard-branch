  <line x1="684" y1="175" x2="720" y2="175" stroke="#c0392b" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="722" y="150" width="302" height="50" rx="5" fill="#fdecea" stroke="#c0392b"/>
  <text x="873" y="173" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1638 von 1782 Bars lagen schon im Archiv</text>
  <text x="873" y="190" font-size="11" fill="#c0392b" text-anchor="middle">92 % verschwendet · F1/F2 strukturell blind</text>

  <rect x="56" y="218" width="968" height="68" rx="5" fill="#fdf6ec" stroke="#c98a1a"/>
  <text x="72" y="240" font-size="12" font-weight="bold" fill="#8a5d0d">F3 — die zweite Lehre, die Phase 13 direkt trägt</text>
  <text x="72" y="260" font-size="11" fill="#5b6470">Eine Mitten-Lücke im Trade-Fenster erzeugte eine <tspan font-weight="bold" fill="#c0392b">erfundene</tspan> TIME_STOP-Auflösung — DB und Heartbeat konnten nicht zwischen „echt gestoppt"</text>
  <text x="72" y="276" font-size="11" fill="#5b6470">und „Lücke, SL-Treffer fehlt" unterscheiden. Lösung: Coverage-Check <tspan font-weight="bold">vor</tspan> resolve_paper_trade (L3, A3).</text>


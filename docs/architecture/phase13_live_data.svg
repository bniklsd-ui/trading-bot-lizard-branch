  <text x="72" y="876" font-size="11" fill="#1e7a4d">✓  50 Phase-13-Tests + 1508 repo-weit grün</text>
  <text x="72" y="896" font-size="11" fill="#1e7a4d">✓  main synchron mit origin/main (Push erteilt)</text>
  <text x="72" y="920" font-size="11" fill="#c98a1a">→  Beweiswoche (Plan §7 P1–P9): operator-getrieben, separater Track</text>

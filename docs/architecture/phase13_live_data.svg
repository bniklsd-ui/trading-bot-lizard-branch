  <text x="72" y="960" font-size="11" fill="#c98a1a">→  Phase 14 (Discovery): Concept, execution-ready Plan ausstehend</text>
  <text x="72" y="980" font-size="11" fill="#c98a1a">→  Phase 15 (V4): deferred, gegatet auf P9+11+12+13+14</text>


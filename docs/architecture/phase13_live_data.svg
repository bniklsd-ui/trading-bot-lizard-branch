  <rect x="40" y="320" width="1000" height="400" rx="6" fill="#ffffff" stroke="#d5d9de"/>
  <rect x="40" y="320" width="1000" height="30" rx="6" fill="#e8f5ee"/>
  <rect x="40" y="340" width="1000" height="10" fill="#e8f5ee"/>

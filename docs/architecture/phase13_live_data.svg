  <text x="370" y="190" font-size="11" fill="#5b6470" text-anchor="middle">Voll-Refetch bei jedem Tick</text>

  <line x1="462" y1="175" x2="498" y2="175" stroke="#c0392b" stroke-width="1.6" marker-end="url(#ar)"/>


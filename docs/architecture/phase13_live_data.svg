  <rect width="1080" height="1080" fill="#f7f8fa"/>

  <text x="40" y="46" font-size="25" font-weight="bold" fill="#1b1f24">Phase 13 — Beschaffung ≠ Verbrauch: vier Stufen, ein Archiv, kein Konsumenten-Kauf</text>
  <text x="40" y="70" font-size="13.5" fill="#5b6470">Stand 2026-08-22 · Code-complete + live-verifiziert für DE40/FR40 (962 capital-Bars) · Beweiswoche läuft als separater Validierungstrack</text>
  <line x1="40" y1="84" x2="1040" y2="84" stroke="#d5d9de" stroke-width="1"/>

  <!-- ================= PANEL 1 — FEHLERBILD (kurz) ================= -->

  <text x="72" y="282" font-size="11" fill="#5b6470"><tspan font-weight="bold">K2:</tspan> 92 % der gekauften Bars trugen yF-Zeitstempel im Archiv. „Billiger kaufen" hilft nicht — „gar nicht kaufen" ist die Antwort.</text>

  <text x="56" y="1006" font-size="11" fill="#5b6470"><tspan font-weight="bold" fill="#c98a1a">③</tspan> <tspan font-weight="bold">Heute-Verhalten bit-identisch</tspan> (AK9): VETO 5 mit leerem `longterm_rules=()` ist ein No-Op — der Bot entscheidet exakt wie vor Block C. Die strukturelle Verbesserung wartet auf die Promotion-Bridge, nicht auf den Code.</text>
  <text x="56" y="1026" font-size="11" fill="#5b6470" font-style="italic">Diese drei Sichtbarkeiten sind die nicht-erfundenen Antworten auf die zentrale Phase-Frage: „Was lernt der Bot?". Wer alle drei sieht, hat den Stand verstanden.</text>
  <text x="56" y="1052" font-size="10" fill="#5b6470" font-style="italic">Stil konsistent mit `phase13_live_data.svg`, `phase12_closeout.svg`, `phase12_5_failure.svg`, `phase10_v3.svg`, `data_foundation.svg`, `phase13_14_15.svg`. 1080×1080, valid SVG.</text>


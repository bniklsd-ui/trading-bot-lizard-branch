  <text x="56" y="944" font-size="14" font-weight="bold" fill="#8a5d0d">Was das Bild trägt — die zwei Elemente, die man sehen können muss, ohne den Text zu lesen:</text>
  <text x="56" y="966" font-size="11.5" fill="#5b6470"><tspan font-weight="bold" fill="#c0392b">①</tspan> <tspan font-weight="bold">Der Reward-Loop, der Verluste belohnt</tspan> (Block B Auslöser): −1 972,87 EUR P&amp;L bei +28,72 Score. <tspan font-weight="bold">process_weight=1,5</tspan> machte <tspan font-weight="bold">|process|=3,75</tspan> größer als <tspan font-weight="bold">|outcome bei R=−1|=2,0</tspan> — ein Stop-Out nettete <tspan font-weight="bold" fill="#c0392b">+1,10</tspan>.</text>
